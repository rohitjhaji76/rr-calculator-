<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babu Calculator Pro</title>

<link rel="stylesheet" href="style.css">

</head>
<body>
 <div class="top-buttons">
    <button id="themeBtn">🌙</button>
    <button id="historyBtn">📜</button>
    <button id="clearHistory">🗑</button>
</div>
<div class="calculator">
<div id="historyBox">
<h3>📜 Calculation History</h3>
<ul id="historyList"></ul>
</div>
<div id="expression"></div>
<input type="text" id="display" placeholder="0" readonly>

<div id="liveResult"></div>
<div class="buttons">
<button class="clear">C</button>
<button class="operator">⌫</button>
<button class="operator">%</button>
<button class="operator">√</button>
<button class="operator">x²</button>
<button class="operator" id="cubeBtn">x³</button>
<button class="operator">1/x</button>
<button class="operator">ANS</button>
<button class="operator">÷</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">
  ×</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">-</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">+</button>

<button>0</button>
<button>.</button>
<button class="equal">=</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>3
